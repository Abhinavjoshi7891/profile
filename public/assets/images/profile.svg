<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <circle cx="150" cy="150" r="148" fill="url(#avatarGrad)" stroke="url(#ringGrad)" stroke-width="3"/>
  <!-- Tech grid background -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="0" y1="100" x2="300" y2="100"/>
    <line x1="0" y1="200" x2="300" y2="200"/>
  </g>
  <!-- Stylized avatar silhouette -->
  <circle cx="150" cy="115" r="45" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 80 230 C 80 185, 115 175, 150 175 C 185 175, 220 185, 220 230 Z" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <!-- Initials overlay badge -->
  <rect x="110" y="240" width="80" height="28" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="150" y="259" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">AJ · ROBOTICS</text>
</svg>
