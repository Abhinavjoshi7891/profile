<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgGradHand)"/>

  <!-- Badges -->
  <rect x="24" y="22" width="180" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="36" y="39" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DEXTEROUS LEAP HAND</text>

  <rect x="212" y="22" width="140" height="26" rx="13" fill="#4338ca" fill-opacity="0.25" stroke="#6366f1" stroke-width="1"/>
  <text x="224" y="39" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">MUJOCO PLAYGROUND (MJX)</text>

  <rect x="360" y="22" width="155" height="26" rx="13" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
  <text x="372" y="39" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BRAX PPO · 8192 ENVS</text>

  <!-- Graphic: Multi-fingered hand holding reorienting cube -->
  <g transform="translate(190, 65)">
    <!-- Palm -->
    <path d="M 60 140 L 160 140 L 140 180 L 80 180 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Fingers (16 DOF) -->
    <!-- Thumb -->
    <path d="M 60 150 L 30 130 L 25 90 L 50 80" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="30" cy="130" r="4" fill="#38bdf8"/>
    <circle cx="25" cy="90" r="4" fill="#38bdf8"/>
    <!-- Index -->
    <path d="M 80 140 L 75 95 L 75 55 L 85 40" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="95" r="4" fill="#38bdf8"/>
    <circle cx="75" cy="55" r="4" fill="#38bdf8"/>
    <!-- Middle -->
    <path d="M 110 140 L 110 90 L 110 50 L 118 35" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="110" cy="90" r="4" fill="#38bdf8"/>
    <circle cx="110" cy="50" r="4" fill="#38bdf8"/>
    <!-- Ring -->
    <path d="M 140 140 L 145 95 L 145 58 L 140 45" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
    <circle cx="145" cy="95" r="4" fill="#38bdf8"/>
    <circle cx="145" cy="58" r="4" fill="#38bdf8"/>

    <!-- Reorienting Cube at Center -->
    <g transform="translate(90, 75)">
      <!-- Isometric Cube -->
      <polygon points="20,0 45,-12 45,18 20,30" fill="#3b82f6" fill-opacity="0.7" stroke="#60a5fa" stroke-width="1.5"/>
      <polygon points="-5,-12 20,0 20,30 -5,18" fill="#1d4ed8" fill-opacity="0.7" stroke="#60a5fa" stroke-width="1.5"/>
      <polygon points="-5,-12 20,-24 45,-12 20,0" fill="#60a5fa" fill-opacity="0.7" stroke="#93c5fd" stroke-width="1.5"/>
      <!-- Rotation Arc -->
      <path d="M 5 28 A 18 18 0 1 0 38 28" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,2"/>
      <polygon points="40,28 34,24 37,32" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Left Callout Box -->
  <g transform="translate(30, 85)">
    <rect width="130" height="110" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="24" fill="#fcd34d" font-family="monospace" font-size="12" font-weight="bold">205M</text>
    <text x="12" y="38" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Training timesteps</text>
    <text x="12" y="62" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">16–18k</text>
    <text x="12" y="76" fill="#94a3b8" font-family="sans-serif" font-size="9.5">steps/sec on laptop GPU</text>
    <text x="12" y="98" fill="#34d399" font-family="monospace" font-size="10">RTX 4060 (8GB)</text>
  </g>

  <!-- Right Callout Box -->
  <g transform="translate(440, 85)">
    <rect width="130" height="110" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="12" y="24" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SimToolReal Stack</text>
    <text x="12" y="42" fill="#94a3b8" font-family="monospace" font-size="9">Isaac Sim 5.1</text>
    <text x="12" y="58" fill="#94a3b8" font-family="monospace" font-size="9">29-DOF Kuka +</text>
    <text x="12" y="72" fill="#94a3b8" font-family="monospace" font-size="9">SharPa Hand</text>
    <text x="12" y="94" fill="#f472b6" font-family="monospace" font-size="9">6 Tool Tasks</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(30, 245)">
    <rect width="540" height="70" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="monospace" font-size="10.5">LeapCubeReorient in MJX: Two-stage checkpoint resumption, custom sim2sim interactive viewer.</text>
    <text x="16" y="44" fill="#38bdf8" font-family="monospace" font-size="10.5">Tooling instinct surfaced live policy evaluation directly from raw Brax PPO weights.</text>
    <text x="16" y="62" fill="#34d399" font-family="monospace" font-size="10.5">Preparing dexterous manipulation &amp; tool engagement framework for industrial deployment.</text>
  </g>
</svg>
