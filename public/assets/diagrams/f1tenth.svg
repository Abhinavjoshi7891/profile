<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradF1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgGradF1)"/>

  <!-- Badges -->
  <rect x="24" y="22" width="150" height="26" rx="13" fill="#dc2626" fill-opacity="0.25" stroke="#ef4444" stroke-width="1"/>
  <text x="36" y="39" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">F1TENTH / ROBORACER</text>

  <rect x="182" y="22" width="135" height="26" rx="13" fill="#2563eb" fill-opacity="0.25" stroke="#3b82f6" stroke-width="1"/>
  <text x="194" y="39" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACADOS MPC · ROS 2</text>

  <rect x="325" y="22" width="130" height="26" rx="13" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
  <text x="337" y="39" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PHYSICAL 1:10 RACER</text>

  <!-- Track Curvature Background -->
  <path d="M 50 250 C 150 250, 220 180, 290 130 C 370 70, 480 80, 550 170" fill="none" stroke="#1e293b" stroke-width="64" stroke-linecap="round"/>
  <path d="M 50 250 C 150 250, 220 180, 290 130 C 370 70, 480 80, 550 170" fill="none" stroke="#334155" stroke-width="56" stroke-linecap="round"/>

  <!-- Centerline / Frenet Frame -->
  <path d="M 50 250 C 150 250, 220 180, 290 130 C 370 70, 480 80, 550 170" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Optimal Raceline (Two-pass friction-circle solver) -->
  <path d="M 50 240 C 160 260, 240 170, 310 115 C 380 65, 470 95, 540 160" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 1:10 Vehicle Body -->
  <g transform="translate(295, 120) rotate(-42)">
    <rect x="-24" y="-14" width="48" height="28" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <!-- Wheels -->
    <rect x="-20" y="-18" width="12" height="6" rx="2" fill="#94a3b8"/>
    <rect x="8" y="-18" width="12" height="6" rx="2" fill="#94a3b8"/>
    <rect x="-20" y="12" width="12" height="6" rx="2" fill="#94a3b8"/>
    <rect x="8" y="12" width="12" height="6" rx="2" fill="#94a3b8"/>
    <!-- LiDAR Scanner -->
    <circle cx="2" cy="0" r="5" fill="#38bdf8"/>
    <!-- Scan Fan -->
    <path d="M 2 0 L 35 -20 L 40 0 L 35 20 Z" fill="#38bdf8" fill-opacity="0.25"/>
  </g>

  <!-- Prediction Horizon Rollout (MPC) -->
  <path d="M 295 120 Q 345 85, 410 82" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="410" cy="82" r="3" fill="#f59e0b"/>
  <text x="350" y="70" fill="#fcd34d" font-family="monospace" font-size="10">Real-time SQP Horizon</text>

  <!-- Spec Callout Cards -->
  <g transform="translate(30, 275)">
    <rect width="540" height="48" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="14" y="19" fill="#94a3b8" font-family="monospace" font-size="10.5">Jetson Orin Nano · Hokuyo LiDAR · VESC FOC · Pacejka Tyre Model (fitted via NLS)</text>
    <text x="14" y="36" fill="#34d399" font-family="monospace" font-size="10.5">O(N) Two-Pass Friction-Circle Velocity Profiler · Frenet State Machine Overtaking</text>
  </g>
</svg>
