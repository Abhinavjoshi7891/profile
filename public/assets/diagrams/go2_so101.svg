<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="68" x2="600" y2="68"/>
    <line x1="0" y1="136" x2="600" y2="136"/>
    <line x1="0" y1="204" x2="600" y2="204"/>
    <line x1="0" y1="272" x2="600" y2="272"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
  </g>

  <!-- Tag Pill -->
  <rect x="24" y="24" width="170" height="26" rx="13" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1"/>
  <text x="36" y="41" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">WHOLE-BODY LOCO-MANIP</text>

  <rect x="202" y="24" width="130" height="26" rx="13" fill="#4338ca" fill-opacity="0.3" stroke="#6366f1" stroke-width="1"/>
  <text x="214" y="41" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">GENESIS + RSL_RL</text>

  <!-- Ground Plane -->
  <line x1="40" y1="280" x2="560" y2="280" stroke="#475569" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- Robot Schematic: Go2 Body -->
  <rect x="190" y="170" width="130" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="210" cy="191" r="5" fill="#38bdf8"/>
  <text x="225" y="195" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="600">Go2 (12-DOF)</text>

  <!-- Quadruped Legs -->
  <!-- FL Leg -->
  <path d="M 210 212 L 195 245 L 205 280" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="205" cy="280" r="4" fill="#06b6d4"/>
  <!-- FR Leg -->
  <path d="M 230 212 L 245 245 L 235 280" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="235" cy="280" r="4" fill="#38bdf8"/>
  <!-- RL Leg -->
  <path d="M 285 212 L 270 245 L 280 280" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="280" cy="280" r="4" fill="#06b6d4"/>
  <!-- RR Leg -->
  <path d="M 305 212 L 320 245 L 310 280" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="310" cy="280" r="4" fill="#38bdf8"/>

  <!-- Mounted SO-101 Arm (6-DOF) -->
  <circle cx="300" cy="170" r="8" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 300 170 L 335 125 L 390 100 L 430 115" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="335" cy="125" r="5" fill="#fbbf24"/>
  <circle cx="390" cy="100" r="5" fill="#fbbf24"/>
  <!-- End Effector Gripper & Target Reach -->
  <path d="M 430 110 L 445 115 L 430 120" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="455" cy="115" r="7" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="455" cy="115" r="3" fill="#10b981"/>
  <text x="468" y="119" fill="#34d399" font-family="monospace" font-size="10">Target (1-3 cm err)</text>

  <!-- Trajectory Arc -->
  <path d="M 330 145 Q 400 65 455 115" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Leader Arm Teleop Signal -->
  <g transform="translate(60, 90)">
    <rect width="105" height="48" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="10" y="20" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">PHYSICAL LEADER</text>
    <text x="10" y="38" fill="#e0e7ff" font-family="monospace" font-size="11">SO-101 Arm</text>
  </g>
  <path d="M 165 114 C 210 114, 240 140, 290 165" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="292,166 283,161 285,170" fill="#818cf8"/>
  <text x="180" y="132" fill="#818cf8" font-family="sans-serif" font-size="9">Live 6D Pose Teleop</text>

  <!-- Metric Badges Bottom -->
  <g transform="translate(40, 298)">
    <text x="0" y="18" fill="#94a3b8" font-family="monospace" font-size="11">18 Actuated DOF</text>
    <text x="135" y="18" fill="#64748b" font-family="monospace" font-size="11">|</text>
    <text x="150" y="18" fill="#38bdf8" font-family="monospace" font-size="11">Single RL Policy (PPO)</text>
    <text x="325" y="18" fill="#64748b" font-family="monospace" font-size="11">|</text>
    <text x="340" y="18" fill="#34d399" font-family="monospace" font-size="11">Bipedal Stand &lt;1° + 2.5m/s Run</text>
  </g>
</svg>
