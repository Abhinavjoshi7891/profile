<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCroc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#141d38"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgGradCroc)"/>

  <!-- Badges -->
  <rect x="24" y="22" width="185" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="36" y="39" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CROCODDYL &amp; PINOCCHIO</text>

  <rect x="219" y="22" width="145" height="26" rx="13" fill="#10b981" fill-opacity="0.25" stroke="#34d399" stroke-width="1"/>
  <text x="231" y="39" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FDDP OPTIMAL CONTROL</text>

  <rect x="374" y="22" width="145" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.25" stroke="#a78bfa" stroke-width="1"/>
  <text x="386" y="39" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FLOATING-BASE OCP</text>

  <!-- Split Comparison: Go2 (Point Contact) vs Talos (Flat-Sole Wrench Cone) -->
  <!-- Left Side: Go2 -->
  <g transform="translate(60, 75)">
    <rect width="210" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">UNITREE GO2 (QUADRUPED)</text>
    <text x="14" y="42" fill="#94a3b8" font-family="monospace" font-size="9.5">Point-Contact Model</text>
    <line x1="20" y1="130" x2="190" y2="130" stroke="#475569" stroke-width="2"/>
    
    <!-- Contact point & friction cone -->
    <polygon points="105,130 80,80 130,80" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="105" y1="130" x2="105" y2="70" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="105" cy="130" r="4" fill="#ef4444"/>
    <text x="14" y="105" fill="#fca5a5" font-family="monospace" font-size="9">Single-leg diverges</text>
  </g>

  <!-- Right Side: Talos -->
  <g transform="translate(330, 75)">
    <rect width="210" height="150" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <text x="14" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TALOS HUMANOID (BIPED)</text>
    <text x="14" y="42" fill="#94a3b8" font-family="monospace" font-size="9.5">Flat-Sole Wrench Cone</text>
    <line x1="20" y1="130" x2="190" y2="130" stroke="#475569" stroke-width="2"/>
    
    <!-- Sole & Wrench Cone -->
    <rect x="80" y="126" width="50" height="8" rx="2" fill="#10b981"/>
    <polygon points="80,126 130,126 150,65 60,65" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="105" fill="#6ee7b7" font-family="monospace" font-size="9">Single-foot converges</text>
    <text x="14" y="120" fill="#a7f3d0" font-family="monospace" font-size="9">8.1× Warm-Start Speedup</text>
  </g>

  <!-- Bottom Insight -->
  <g transform="translate(30, 245)">
    <rect width="540" height="70" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="monospace" font-size="10.5">Finding: Discrete contact set—not leg count—dictates achievable OCP stability.</text>
    <text x="16" y="44" fill="#fcd34d" font-family="monospace" font-size="10.5">FDDP solver contact-mode switching benchmarked across quadrupeds and humanoids.</text>
    <text x="16" y="62" fill="#38bdf8" font-family="monospace" font-size="10.5">Cross-validated against MJPC (Sampling vs iLQG real-time factors).</text>
  </g>
</svg>
