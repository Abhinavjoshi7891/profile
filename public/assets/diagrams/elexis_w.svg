<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradElexis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#161f30"/>
    </linearGradient>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgGradElexis)"/>

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="0.8">
    <line x1="0" y1="85" x2="600" y2="85"/>
    <line x1="0" y1="170" x2="600" y2="170"/>
    <line x1="0" y1="255" x2="600" y2="255"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
  </g>

  <!-- Header Badges -->
  <rect x="24" y="22" width="195" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="36" y="39" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ELEXIS-W WHEELED HUMANOID</text>

  <rect x="227" y="22" width="130" height="26" rx="13" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
  <text x="239" y="39" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ADDVERB RESEARCH</text>

  <rect x="365" y="22" width="125" height="26" rx="13" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1"/>
  <text x="377" y="39" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ISAAC LAB · PPO</text>

  <!-- Corridor Bounds -->
  <line x1="60" y1="75" x2="540" y2="75" stroke="#334155" stroke-width="2" stroke-dasharray="8,6"/>
  <line x1="60" y1="265" x2="540" y2="265" stroke="#334155" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="70" y="93" fill="#64748b" font-family="monospace" font-size="10">Corridor Boundary (Occupancy Constraint)</text>

  <!-- Robot Safety Disc (0.79m envelope) -->
  <circle cx="190" cy="170" r="68" fill="url(#discGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="135" y="105" fill="#38bdf8" font-family="monospace" font-size="10">0.79m Arm-Reach Disc</text>

  <!-- Elexis-W Schematic (Center at 190, 170) -->
  <!-- Base -->
  <ellipse cx="190" cy="180" rx="26" ry="16" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <rect x="160" y="174" width="8" height="14" rx="3" fill="#0284c7"/>
  <rect x="212" y="174" width="8" height="14" rx="3" fill="#0284c7"/>
  <!-- Torso & Arms -->
  <rect x="183" y="140" width="14" height="32" rx="4" fill="#38bdf8"/>
  <circle cx="190" cy="133" r="8" fill="#e2e8f0"/>
  <!-- 7-DOF Arm Left -->
  <path d="M 183 146 L 160 148 L 145 160" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
  <!-- 7-DOF Arm Right -->
  <path d="M 197 146 L 220 148 L 235 160" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>

  <!-- Pedestrian Obstacle (Moving at 380, 170) -->
  <circle cx="390" cy="170" r="16" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2"/>
  <circle cx="390" cy="170" r="6" fill="#f87171"/>
  <text x="365" y="145" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="600">Dynamic Agent</text>
  <!-- Pedestrian Velocity Vector -->
  <line x1="390" y1="170" x2="330" y2="170" stroke="#f87171" stroke-width="2.5"/>
  <polygon points="325,170 335,166 335,174" fill="#f87171"/>
  <text x="330" y="160" fill="#f87171" font-family="monospace" font-size="9">v_rel</text>

  <!-- Time-to-Collision Trajectory / Timing Field -->
  <path d="M 190 170 C 230 170, 270 230, 360 230 C 430 230, 480 170, 520 170" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <polygon points="526,170 516,165 516,175" fill="#10b981"/>
  <text x="260" y="246" fill="#34d399" font-family="monospace" font-size="10">Evasion Trajectory (Timing formulation, TTC = 2.46s)</text>

  <!-- Formulation callout box -->
  <g transform="translate(60, 280)">
    <rect width="480" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="16" y="17" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">KEY RESEARCH INSIGHT:</text>
    <text x="16" y="32" fill="#e2e8f0" font-family="monospace" font-size="10.5">Distance cost triggers frozen-robot attractor → TTC reward collapses stall; arrival: 0% → 89.4%</text>
  </g>
</svg>
