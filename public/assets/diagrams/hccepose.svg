<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradHcce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#182740"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgGradHcce)"/>

  <!-- Badges -->
  <rect x="24" y="22" width="165" height="26" rx="13" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="36" y="39" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">6D/9D PALLET POSE</text>

  <rect x="199" y="22" width="155" height="26" rx="13" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1"/>
  <text x="211" y="39" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HCCEPOSE ADAPTATION</text>

  <rect x="364" y="22" width="145" height="26" rx="13" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
  <text x="376" y="39" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">BLENDERPROC → BOP</text>

  <!-- Central Graphic: Metal Pallet Under Specular Glare vs 6D Bounding Box -->
  <g transform="translate(40, 75)">
    <!-- Input View with Specular Glare -->
    <rect width="180" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="12" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">MONOCULAR RGB INPUT</text>
    
    <!-- Metal Pallet Silhouette -->
    <path d="M 25 100 L 155 100 L 140 135 L 40 135 Z" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <rect x="40" y="105" width="25" height="20" rx="2" fill="#1e293b"/>
    <rect x="80" y="105" width="25" height="20" rx="2" fill="#1e293b"/>
    <rect x="120" y="105" width="20" height="20" rx="2" fill="#1e293b"/>
    <!-- Specular Glare Flash -->
    <circle cx="90" cy="98" r="22" fill="#ffffff" fill-opacity="0.6"/>
    <text x="45" y="75" fill="#fca5a5" font-family="monospace" font-size="9">Severe Specular Glare</text>
  </g>

  <!-- Transition Arrow -->
  <g transform="translate(230, 140)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#38bdf8" stroke-width="2.5"/>
    <polygon points="45,10 35,5 35,15" fill="#38bdf8"/>
    <text x="-15" y="-5" fill="#7dd3fc" font-family="monospace" font-size="8.5">Gray-Coded 2D-3D</text>
  </g>

  <!-- Output 6D/9D Pose Estimation -->
  <g transform="translate(285, 75)">
    <rect width="275" height="150" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="14" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">4-WAY PNP + RANSAC HYPOTHESIS VOTE</text>
    
    <!-- 3D Oriented Bounding Box -->
    <!-- Front Face -->
    <polygon points="60,95 210,85 190,125 40,135" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Back Face -->
    <polygon points="90,65 240,55 220,95 70,105" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Connectors -->
    <line x1="60" y1="95" x2="90" y2="65" stroke="#10b981" stroke-width="1.5"/>
    <line x1="210" y1="85" x2="240" y2="55" stroke="#10b981" stroke-width="1.5"/>
    <line x1="190" y1="125" x2="220" y2="95" stroke="#10b981" stroke-width="1.5"/>
    <line x1="40" y1="135" x2="70" y2="105" stroke="#10b981" stroke-width="1.5"/>

    <!-- Coordinate Frame (X: Red, Y: Green, Z: Blue) -->
    <g transform="translate(130, 105)">
      <line x1="0" y1="0" x2="35" y2="5" stroke="#ef4444" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="-5" y2="-30" stroke="#10b981" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="20" y2="-20" stroke="#3b82f6" stroke-width="2.5"/>
    </g>
    <text x="175" y="130" fill="#34d399" font-family="monospace" font-size="9.5">180° Flip Resolved</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(30, 245)">
    <rect width="540" height="70" rx="8" fill="#111c30" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="24" fill="#94a3b8" font-family="monospace" font-size="10.5">Problem: RGB-D fails on specular metal pallets &amp; cost limits sensors on commercial fleet.</text>
    <text x="16" y="44" fill="#fcd34d" font-family="monospace" font-size="10.5">Solution: Dense per-pixel correspondence + consensus voting eliminates glare pixels.</text>
    <text x="16" y="62" fill="#38bdf8" font-family="monospace" font-size="10.5">Target: Sub-20ms inference budget on low-cost onboard Intel compute target.</text>
  </g>
</svg>
