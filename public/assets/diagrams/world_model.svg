<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradWM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0e17"/>
      <stop offset="100%" stop-color="#1f1833"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" rx="12" fill="url(#bgGradWM)"/>

  <!-- Badges -->
  <rect x="24" y="22" width="180" height="26" rx="13" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-width="1"/>
  <text x="36" y="39" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">DREAMERV4 WORLD MODEL</text>

  <rect x="212" y="22" width="135" height="26" rx="13" fill="#ec4899" fill-opacity="0.25" stroke="#f472b6" stroke-width="1"/>
  <text x="224" y="39" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">JAX / FLAX · RSSM</text>

  <rect x="355" y="22" width="155" height="26" rx="13" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1"/>
  <text x="367" y="39" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SO-101 ARM DEPLOYMENT</text>

  <!-- World Model Latent Imagination Rollout Architecture -->
  <g transform="translate(40, 75)">
    <!-- Observation Box -->
    <rect x="0" y="20" width="90" height="90" rx="6" fill="#1e1b2e" stroke="#6b21a8" stroke-width="1.5"/>
    <text x="8" y="42" fill="#c084fc" font-family="sans-serif" font-size="9.5" font-weight="600">OBSERVATION</text>
    <rect x="15" y="55" width="60" height="40" rx="4" fill="#2e1065"/>
    <text x="22" y="78" fill="#e9d5ff" font-family="monospace" font-size="9">64×64×3</text>
    <text x="18" y="125" fill="#a855f7" font-family="monospace" font-size="9">VAE Encoder</text>

    <!-- Arrow to Latent Token -->
    <path d="M 90 65 L 130 65" stroke="#a855f7" stroke-width="2"/>
    <polygon points="135,65 125,60 125,70" fill="#a855f7"/>

    <!-- Latent State z_t -->
    <rect x="140" y="35" width="60" height="60" rx="6" fill="#4a044e" stroke="#f472b6" stroke-width="2"/>
    <text x="152" y="68" fill="#fdf4ff" font-family="monospace" font-size="14" font-weight="bold">z_t</text>
    <text x="142" y="112" fill="#f472b6" font-family="monospace" font-size="9">Latent Token</text>

    <!-- Space-Time Causal Transformer / RSSM -->
    <g transform="translate(230, 10)">
      <rect width="170" height="110" rx="8" fill="#2e1065" stroke="#c084fc" stroke-width="2"/>
      <text x="12" y="26" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SPACE-TIME DYNAMICS</text>
      <!-- Imagination Rollouts -->
      <path d="M 20 65 C 50 45, 90 45, 150 65" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="20" cy="65" r="4" fill="#f472b6"/>
      <circle cx="70" cy="50" r="4" fill="#a855f7"/>
      <circle cx="110" cy="50" r="4" fill="#a855f7"/>
      <circle cx="150" cy="65" r="4" fill="#10b981"/>
      <text x="25" y="85" fill="#e9d5ff" font-family="monospace" font-size="9">Imagined Trajectory \hat{z}_{t+k}</text>
      <text x="25" y="100" fill="#34d399" font-family="monospace" font-size="8.5">Actor-Critic Planning in Latent</text>
    </g>

    <!-- Arrow to Action -->
    <path d="M 400 65 L 435 65" stroke="#10b981" stroke-width="2"/>
    <polygon points="440,65 430,60 430,70" fill="#10b981"/>

    <!-- Action / Arm Execution -->
    <g transform="translate(445, 20)">
      <rect width="75" height="90" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="40" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="600">ACTION</text>
      <text x="12" y="60" fill="#ffffff" font-family="monospace" font-size="11">a_t ∈ ℝ^6</text>
      <text x="8" y="80" fill="#a7f3d0" font-family="monospace" font-size="8.5">SO-101 Joint</text>
    </g>
  </g>

  <!-- Technical Abstract Callout -->
  <g transform="translate(30, 235)">
    <rect width="540" height="80" rx="8" fill="#140e26" stroke="#2e1065" stroke-width="1"/>
    <text x="16" y="24" fill="#e9d5ff" font-family="monospace" font-size="10.5">Focus: Spatiotemporal causal transformer dynamics trained on 8 GB consumer VRAM.</text>
    <text x="16" y="44" fill="#f472b6" font-family="monospace" font-size="10.5">Validated on CoinRun; closed-loop latent imagination actor-critic under active development.</text>
    <text x="16" y="64" fill="#34d399" font-family="monospace" font-size="10.5">Next: Deploying learned world dynamics to real SO-101 arm hardware to explore failure modes.</text>
  </g>
</svg>
